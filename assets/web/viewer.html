<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Nova</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body { background:#0D1420; }
  body.pet { background:transparent; }
  canvas { display:block; width:100%; height:100%; }
  body.pet canvas { cursor:grab; }
  #err { position:fixed; left:8px; bottom:8px; color:#FF7B7B; font:11px Consolas,monospace;
         max-width:96%; white-space:pre-wrap; text-shadow:0 1px 2px #000; }
  /* Pet-only chat UI — hidden unless ?pet=1 */
  #petui { display:none; }
  body.pet #petui { display:block; }
  #bubble { position:fixed; left:50%; top:12px; transform:translateX(-50%);
            max-width:88%; padding:8px 11px; border-radius:12px;
            background:rgba(10,18,28,.82); border:1px solid rgba(0,229,255,.45);
            color:#E8F6FF; font:12px/1.35 Consolas,monospace; text-align:center;
            text-shadow:0 1px 2px #000; pointer-events:none; opacity:0;
            transition:opacity .25s; box-shadow:0 4px 18px rgba(0,0,0,.45); }
  #bubble.show { opacity:1; }
  #chatbar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
             width:78%; display:flex; gap:5px; opacity:0; pointer-events:none;
             transition:opacity .2s; }
  #chatbar.show { opacity:1; pointer-events:auto; }
  #chatbar input { flex:1; min-width:0; padding:7px 9px; border-radius:9px;
                   border:1px solid rgba(0,229,255,.5); outline:none;
                   background:rgba(10,18,28,.9); color:#E8F6FF;
                   font:12px Consolas,monospace; }
  #chatbar input::placeholder { color:#6C8398; }
  #chatbar button { border:1px solid rgba(0,229,255,.5); border-radius:9px;
                    background:rgba(0,229,255,.18); color:#E8F6FF;
                    font:12px Consolas,monospace; padding:6px 10px; cursor:pointer; }
  #hint { position:fixed; right:8px; bottom:6px; color:#5E7488;
          font:9px Consolas,monospace; pointer-events:none; }
</style>
<script type="importmap">
{"imports": {"three": "/web/three.module.js"}}
</script>
</head>
<body>
<div id="err"></div>
<div id="petui">
  <div id="bubble"></div>
  <form id="chatbar">
    <input id="chatinput" autocomplete="off" placeholder="say something to Nova…">
    <button type="submit">➤</button>
  </form>
  <div id="hint">double-click to talk</div>
</div>
<script type="module" src="/web/viewer.js"></script>
</body>
</html>
